<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minesweeper Online Clone</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<h2>Minesweeper Online Clone</h2>

<div id="difficultySelect">
Difficulty:&nbsp;
<select id="difficulty">
  <option value="easy">Easy</option>
  <option value="intermediate">Intermediate</option>
  <option value="hard">Hard</option>
</select>
</div>

<div id="wrapper">
  <div id="topbar">
    <div id="mineCounter" class="digits">010</div>
    <div id="smiley">😊</div>
    <div id="timer" class="digits">000.000</div>
  </div>
  <canvas id="board"></canvas>
</div>

<div>
  <button id="flagToggle">Flag Mode: OFF</button>
</div>

<div id="stats"></div>
<div id="leaderboard"></div>

<div id="settings">
  <h4>Settings</h4>
  <label><input type="checkbox" id="mobileMode"> Mobile Mode</label><br>
  <label><input type="checkbox" id="showStats" checked> Show Stats</label><br>
  <button id="resetHigh">Reset High Score</button>
</div>

<script src="script.js"></script>
</body>
</html>
