<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lewis' Minesweeper</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<h2>Lewis' Minesweeper</h2>

<div id="difficultySelect">
Difficulty:&nbsp;
<select id="difficulty">
  <option value="easy">Easy</option>
  <option value="intermediate">Intermediate</option>
  <option value="hard">Hard</option>
</select>
</div>

<div id="wrapper">
  <div id="topbar">
    <div id="mineCounter" class="digits">010</div>
    <div id="smiley">😊</div>
    <div id="timer" class="digits">000.000</div>
  </div>
  <canvas id="board"></canvas>
</div>

<div>
  <button id="flagToggle">Flag Mode: OFF</button>
</div>

<div id="stats"></div>
<div id="leaderboard"></div>

<div id="settings">
  <h4>Settings</h4>
  <label><input type="checkbox" id="showStats" checked> Show Stats</label><br>
</div>

<!-- Hidden leaderboard modal (functional only, no visible UI change) -->
<div id="leaderboardModal" hidden>
  <div id="leaderboardBox">
    <button id="closeLeaderboard">✖</button>
    <h3>Leaderboard</h3>
    <div>
      Difficulty: 
      <select id="lbDifficulty">
        <option value="easy">Easy</option>
        <option value="intermediate">Intermediate</option>
        <option value="hard">Hard</option>
      </select>
      Category:
      <select id="lbCategory">
        <option value="time">Fastest Time</option>
        <option value="3bvs">3BV/s</option>
        <option value="eff">Efficiency</option>
        <option value="recent">Most Recent</option>
      </select>
    </div>
    <div id="leaderboardList"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
