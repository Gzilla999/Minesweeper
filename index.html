<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lewis' Minesweeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./favicon.png">
</head>

<body>
    <h1>Lewis' Minesweeper</h1>

    <div id="difficultySelect">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="intermediate">Intermediate</option>
            <option value="hard">Hard</option>
        </select>
    </div>

    <div id="wrapper">
        <div id="topbar">
            <div id="mineCounter" class="digits">010</div>
            
            <button id="smiley" aria-label="Reset Game">😊</button>
            
            <div id="timer" class="digits">000.000</div>
        </div>
        
        <canvas id="board" tabindex="0" aria-label="Minesweeper board game"></canvas>
    </div>

    <div id="controls">
        <button id="flagToggle">Flag Mode: OFF</button>
    </div>

    <div id="stats"></div>
    <h2>Leaderboard</h2>
    <div id="leaderboard"></div>

    <div id="settings">
        <h3>Settings</h3>
        <label><input type="checkbox" id="mobileMode"> Mobile Mode</label><br>
        <label><input type="checkbox" id="showStats" checked> Show Stats</label><br>
        <label>Theme colour: <input type="color" id="themeColor" value="#c0c0c0"></label><br>
        <label>Long Press Duration (ms): 
            <input type="number" id="longPressDuration" min="100" max="1000" step="50" value="200">
            <span id="longPressDurationValue">200ms</span>
        </label><br>
    </div>

    <script src="script.js"></script>
</body>
</html>
