<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minesweeper Online Clone</title>
<style>
    /* --- CSS STYLES --- */
    /* General body styling for that retro Windows 95 gray look */
    body { background:#c0c0c0; font-family:Tahoma, sans-serif; text-align:center; }
    
    /* Main container for the game */
    #wrapper { display:inline-block; background:#c0c0c0; border:4px solid #808080; padding:6px; }
    
    /* The header containing the counters and smiley face */
    #topbar { display:flex; justify-content:space-between; align-items:center; background:#c0c0c0; border:3px solid #808080; margin-bottom:6px; padding:4px; }
    
    /* Digital clock/counter styling (red text on black background) */
    .digits { background:black; color:red; font-family:'Courier New', monospace; font-weight:bold; font-size:22px; width:70px; text-align:right; padding:2px; border:inset 2px #808080; cursor:pointer; }
    
    /* The reset button (smiley face) */
    #smiley { width:32px; height:32px; border:2px solid #808080; background:#c0c0c0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; }
    
    /* The drawing area */
    canvas { display:block; background:#c0c0c0; margin:5px 0; }
    
    /* Stats display area */
    #stats { margin-top:8px; font-size:14px; cursor:pointer; white-space:pre; }
    
    button { margin:2px; }
    
    /* Settings panel styling */
    #settings { margin:10px; border:2px solid #808080; background:#c0c0c0; padding:5px; display:inline-block; }
    
    #difficultySelect { margin-bottom:6px; }
    
    /* Leaderboard list items */
    .leaderboard-entry { cursor:pointer; font-size:13px; text-align:left; }
</style>
</head>
<body>
<h2>Minesweeper Online Clone</h2>

<div id="difficultySelect">
Difficulty:&nbsp;
<select id="difficulty">
  <option value="easy">Easy</option>
  <option value="intermediate">Intermediate</option>
  <option value="hard">Hard</option>
</select>
</div>

<div id="wrapper">
  <div id="topbar">
    <div id="mineCounter" class="digits">010</div>
    <div id="smiley">😊</div> <div id="timer" class="digits">000.000</div>
  </div>
  <canvas id="board"></canvas> </div>

<div>
  <button id="flagToggle">Flag Mode: OFF</button>
</div>

<div id="stats"></div>
<div id="leaderboard"></div>

<div id="settings">
  <h4>Settings</h4>
  <label><input type="checkbox" id="mobileMode"> Mobile Mode</label><br>
  <label><input type="checkbox" id="showStats" checked> Show Stats</label><br>
  <button id="resetHigh">Reset High Score</button>
</div>

<script>
/* --- CONFIGURATION --- */
// Standard Minesweeper difficulty presets
let difficulties = {
  easy: {rows:9, cols:9, mines:10},
  intermediate: {rows:16, cols:16, mines:40},
  hard: {rows:16, cols:30, mines:99}
};

/* --- DOM ELEMENTS & STATE VARIABLES --- */
let currentDifficulty = "easy";
const difficultySelect = document.getElementById("difficulty");

// Event listener to change difficulty and reset board
difficultySelect.addEventListener("change",()=>{ 
    currentDifficulty=difficultySelect.value; 
    setDifficulty(); 
});

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const mineCounter = document.getElementById("mineCounter");
const timer = document.getElementById("timer");
const statsDiv = document.getElementById("stats");
const leaderboardDiv = document.getElementById("leaderboard");
const smiley = document.getElementById("smiley");
const flagToggle = document.getElementById("flagToggle");
const mobileCheckbox = document.getElementById("mobileMode");

let ROWS, COLS, MINES, TILE = 32; // TILE is the pixel size of one square
let grid;       // Stores numbers (0-8) or mine (-1)
let revealed;   // Boolean array: is cell open?
let flagged;    // Boolean array: is cell flagged?
let minesSet;   // Set to track mine locations

// Game State Tracking
let firstClick = true, gameOver = false, win = false;
let startTime = null, endTime = null;
let clickCount = 0;
let threeBV = 0; // "Bechtel's Board Benchmark" (complexity metric)
let moveLog = []; // Stores moves for replay functionality

// UI State
let replaying = false, replayStartTime = 0;
let flagMode = false, mobileMode = false, showStats = true;

// Load High Scores from LocalStorage
let bestScores = JSON.parse(localStorage.getItem("ms_best_scores")||"{}");

/* --- EVENT LISTENERS --- */

// Toggle mobile mode (shows flag button)
mobileCheckbox.addEventListener("change", e => { 
    mobileMode = e.target.checked; 
    flagToggle.style.display = mobileMode ? "inline-block" : "none"; 
});

// Toggle flag mode (for touch screens/single button mouse)
flagToggle.addEventListener("click", () => { 
    flagMode = !flagMode; 
    flagToggle.textContent = "Flag Mode: " + (flagMode ? "ON" : "OFF"); 
});

// Toggle stats visibility
document.getElementById("showStats").addEventListener("change", e => { 
    showStats = e.target.checked; 
    draw(); 
});

// Reset LocalStorage scores
document.getElementById("resetHigh").addEventListener("click", () => { 
    bestScores[currentDifficulty] = []; 
    localStorage.setItem("ms_best_scores", JSON.stringify(bestScores)); 
    updateLeaderboard(); 
    draw(); 
});

/* --- INITIALIZATION --- */

// Sets grid dimensions based on difficulty
function setDifficulty(){
  let d = difficulties[currentDifficulty];
  ROWS = d.rows; COLS = d.cols; MINES = d.mines;
  canvas.width = COLS * TILE;
  canvas.height = ROWS * TILE;
  init();
}

// Resets game variables for a new round
function init(customMines = null){
  grid = Array.from({length:ROWS}, () => Array(COLS).fill(0));
  revealed = Array.from({length:ROWS}, () => Array(COLS).fill(false));
  flagged = Array.from({length:ROWS}, () => Array(COLS).fill(false));
  minesSet = new Set(customMines || []);
  
  firstClick = true; gameOver = false; win = false; 
  startTime = null; endTime = null; 
  clickCount = 0; threeBV = 0; moveLog = []; replaying = false;
  
  smiley.textContent = "😊";
  updateUI(); draw(); updateStats(); updateLeaderboard();
}

/* --- CORE GAME LOGIC --- */

// Places mines AFTER the first click to ensure the user doesn't explode immediately
// Uses a "safe radius" around the clicked coordinate (r0, c0)
function placeMinesSafe(r0, c0, customMines = null){
  let safeCells = new Set();
  
  // Define safe zone (clicked cell + neighbors)
  for(let dr = -1; dr <= 1; dr++) 
    for(let dc = -1; dc <= 1; dc++){ 
        let r = r0 + dr, c = c0 + dc; 
        if(r >= 0 && r < ROWS && c >= 0 && c < COLS) safeCells.add(r + "," + c); 
    }

  // Randomly place mines
  if(customMines){ minesSet = new Set(customMines); } 
  else { 
      while(minesSet.size < MINES){ 
          let r = Math.floor(Math.random() * ROWS), c = Math.floor(Math.random() * COLS); 
          if(safeCells.has(r + "," + c)) continue; 
          minesSet.add(r + "," + c); 
      } 
  }

  // Calculate numbers for the grid
  for(let rc of minesSet){ let [r,c] = rc.split(",").map(Number); grid[r][c] = -1; }
  
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    if(grid[r][c] === -1) continue; 
    let count = 0;
    // Count adjacent mines
    for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++){
      let nr = r + dr, nc = c + dc; 
      if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === -1) count++;
    } 
    grid[r][c] = count;
  }
  threeBV = compute3BV(); // Calculate complexity
}

// 3BV is a metric representing the minimum number of clicks required to clear the board without flagging
// It counts islands of zeros (openings) + non-zero numbers not part of an opening
function compute3BV(){ 
  let visited = Array.from({length:ROWS}, () => Array(COLS).fill(false)), count = 0;
  
  // Recursive flood fill to mark islands of zeros
  function flood(r,c){ 
      if(r < 0 || r >= ROWS || c < 0 || c >= COLS || visited[r][c] || grid[r][c] === -1) return; 
      visited[r][c] = true; 
      if(grid[r][c] === 0) 
        for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++) if(dr || dc) flood(r + dr, c + dc); 
  }
  
  // Count zero-islands
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) 
    if(grid[r][c] === 0 && !visited[r][c]){ count++; flood(r,c); }
  
  // Count remaining non-zero numbers
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) 
    if(grid[r][c] > 0 && !visited[r][c]) count++;
    
  return count;
}

// Reveals a cell. If it's a zero, it recursively reveals neighbors (Flood Fill)
function reveal(r, c, allowFlood = true){ 
    if(r < 0 || r >= ROWS || c < 0 || c >= COLS || revealed[r][c] || flagged[r][c]) return; 
    revealed[r][c] = true; 
    if(allowFlood && grid[r][c] === 0) 
        for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++) if(dr || dc) reveal(r + dr, c + dc, true); 
}

// "Chording": If a number is revealed and has the correct number of flags around it,
// clicking it reveals all unflagged neighbors.
function chord(r, c){ 
    if(grid[r][c] <= 0) return; 
    let flags = 0; 
    // Count surrounding flags
    for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++){ 
        let nr = r + dr, nc = c + dc; 
        if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && flagged[nr][nc]) flags++; 
    } 
    // If flags match the number, reveal the rest
    if(flags !== grid[r][c]) return; 
    for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++){ 
        let nr = r + dr, nc = c + dc; 
        if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && !flagged[nr][nc] && !revealed[nr][nc]) reveal(nr, nc, true); 
    } 
}

// Checks if all non-mine cells have been revealed
function checkWin(){ 
    for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++) 
        if(grid[r][c] != -1 && !revealed[r][c]) return false; 
    return true; 
}

/* --- INPUT HANDLING --- */

function handleClick(r, c, type, logMove = true, replayMove = false){
  if(gameOver && !replayMove) return;

  // Handle First Click Rule
  if(firstClick && type === 'reveal'){ placeMinesSafe(r, c); firstClick = false; }
  
  // Start Timer
  if(!startTime && !replayMove) startTime = performance.now();

  let countedClick = false;
  if(type === 'reveal'){
    if(revealed[r][c]){ 
        chord(r, c); // Try to chord if already revealed
        countedClick = true; 
    } 
    else if(grid[r][c] === -1 && !replayMove){ 
        // Hit a mine!
        gameOver = true; win = false; endTime = performance.now(); 
        smiley.textContent = "😵"; countedClick = true; 
        reveal(r, c, false); 
    } 
    else{ 
        reveal(r, c, true); // Normal reveal
        countedClick = true; 
    }
  } else if(type === 'flag'){ 
      if(!revealed[r][c]) countedClick = true; 
      flagged[r][c] = !flagged[r][c]; 
  }

  // Stats tracking
  if(countedClick && !replayMove) clickCount++;
  if(logMove) moveLog.push({r, c, type, time: performance.now() - (replayMove ? replayStartTime : startTime)});
  
  // Check Win Condition
  if(!gameOver && checkWin() && !replayMove){ 
      gameOver = true; win = true; endTime = performance.now(); 
      smiley.textContent = "😎"; 
      saveHighScore(); 
  }

  updateUI(); draw(); updateStats();
}

// Mouse Event Listeners
canvas.addEventListener("mousedown", e => { if(gameOver || replaying) return; smiley.textContent = "😮"; }); // O-face on click
canvas.addEventListener("mouseup", e => { if(gameOver) return; smiley.textContent = "😊"; });

canvas.addEventListener("mousedown", e => {
  if(replaying) return;
  let rect = canvas.getBoundingClientRect();
  let x = e.clientX - rect.left, y = e.clientY - rect.top;
  let r = Math.floor(y / TILE), c = Math.floor(x / TILE);
  
  // Determine if it's a flag (Right Click) or Reveal (Left Click)
  let type = (e.button === 2) ? 'flag' : (flagMode ? 'flag' : 'reveal');
  handleClick(r, c, type);
});

// Prevent context menu on right click
canvas.addEventListener("contextmenu", e => e.preventDefault());

// Smiley reset
smiley.addEventListener("click", () => { if(!replaying) init(); });

// Replay best score on clicking stats
statsDiv.addEventListener("click", () => { if(bestScores[currentDifficulty] && bestScores[currentDifficulty][0]) replay(bestScores[currentDifficulty][0]); });

/* --- LEADERBOARD & REPLAY SYSTEM --- */

function saveHighScore(){
  if(threeBV < 1) return; // Ignore empty boards
  if(!bestScores[currentDifficulty]) bestScores[currentDifficulty] = [];
  
  let elapsed = (endTime - startTime) / 1000;
  
  // Save game data including the full move log
  bestScores[currentDifficulty].push({
      time: elapsed, clickCount, threeBV, 
      log: moveLog.slice(), win, mines: Array.from(minesSet)
  });
  
  // Sort by time and keep top 10
  bestScores[currentDifficulty].sort((a, b) => a.time - b.time);
  if(bestScores[currentDifficulty].length > 10) bestScores[currentDifficulty] = bestScores[currentDifficulty].slice(0, 10);
  
  localStorage.setItem("ms_best_scores", JSON.stringify(bestScores));
  updateLeaderboard();
}

function updateLeaderboard(){
  leaderboardDiv.innerHTML = "";
  if(!bestScores[currentDifficulty]) return;
  
  bestScores[currentDifficulty].slice(0, 5).forEach((entry, i) => {
    let div = document.createElement('div');
    let efficiency = (entry.clickCount > 0 ? ((entry.threeBV / entry.clickCount) * 100).toFixed(1) + '%' : 'N/A');
    div.className = 'leaderboard-entry';
    div.textContent = `#${i+1}: ${entry.time.toFixed(3)}s | 3BV=${entry.threeBV} | 3BV/s=${(entry.threeBV / entry.time).toFixed(2)} | Eff=${efficiency}`;
    div.onclick = () => replay(entry); // Click to watch replay
    leaderboardDiv.appendChild(div);
  });
}

// Reconstructs a previous game and plays it back visually
function replay(entry){
  if(replaying) return;
  replaying = true;
  firstClick = false; gameOver = false; win = entry.win;

  // Reset grid
  grid = Array.from({length:ROWS}, () => Array(COLS).fill(0));
  revealed = Array.from({length:ROWS}, () => Array(COLS).fill(false));
  flagged = Array.from({length:ROWS}, () => Array(COLS).fill(false));
  
  // Restore mines from the saved log
  minesSet = new Set(entry.mines);
  for(let rc of minesSet){ let [r,c] = rc.split(",").map(Number); grid[r][c] = -1; }

  // Recalculate numbers
  for(let r = 0; r < ROWS; r++) for(let c = 0; c < COLS; c++){
    if(grid[r][c] === -1) continue; 
    let count = 0;
    for(let dr = -1; dr <= 1; dr++) for(let dc = -1; dc <= 1; dc++){
      let nr = r + dr, nc = c + dc; 
      if(nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === -1) count++;
    } 
    grid[r][c] = count;
  }
  threeBV = compute3BV();

  clickCount = 0;
  startTime = performance.now(); 
  replayStartTime = startTime;

  // Execute moves using setTimeout to mimic real-time speed
  entry.log.forEach(m => {
    setTimeout(() => {
      if(m.type === 'reveal'){ 
        reveal(m.r, m.c, true); 
        clickCount++; 
      }
      else if(m.type === 'flag'){ 
        flagged[m.r][m.c] = !flagged[m.r][m.c]; 
        clickCount++; 
      }
      draw();
      updateStats();
    }, m.time);
  });

  // End replay logic
  let totalTime = entry.log[entry.log.length - 1].time;
  setTimeout(() => {
    replaying = false;
    endTime = startTime + totalTime;
    gameOver = true; 
    smiley.textContent = win ? "😎" : "😵"; 
    updateStats();
  }, totalTime);
}

/* --- RENDER LOOP & STATS --- */

function updateStats(){
  if(!gameOver && !replaying){ statsDiv.textContent = ""; return; }
  let elapsed = (endTime && gameOver) ? (endTime - startTime) / 1000 : (performance.now() - startTime) / 1000;
  let efficiency = (clickCount > 0 ? ((threeBV / clickCount) * 100).toFixed(1) + '%' : 'N/A');
  statsDiv.textContent = `${win ? 'Win' : 'Lose'} | Time: ${elapsed.toFixed(3)}s | 3BV=${threeBV} | 3BV/s=${(threeBV / elapsed).toFixed(2)} | Clicks=${clickCount} | Efficiency=${efficiency}`;
}

function updateUI(){
  // Update Mine Counter (Total - Flags)
  let minesLeft = MINES - flagged.flat().filter(f => f).length;
  mineCounter.textContent = String(minesLeft).padStart(3, "0");

  // Update Timer
  let elapsed;
  if(replaying) elapsed = (performance.now() - startTime) / 1000;
  else if(startTime) elapsed = (gameOver ? (endTime - startTime) / 1000 : (performance.now() - startTime) / 1000);
  else elapsed = 0;

  timer.textContent = elapsed.toFixed(3).padStart(7, "0");
}

// Main Draw Loop (Canvas API)
function draw(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for(let r = 0; r < ROWS; r++){
    for(let c = 0; c < COLS; c++){
      let x = c * TILE, y = r * TILE;
      ctx.strokeStyle = "#808080"; ctx.lineWidth = 1;
      
      if(revealed[r][c]){
        // Draw revealed cell
        ctx.fillStyle = "#ddd"; ctx.fillRect(x, y, TILE, TILE); ctx.strokeRect(x, y, TILE, TILE);
        
        // Draw Number
        if(grid[r][c] > 0){ 
            // Colors for 1-8
            ctx.fillStyle = ["", "blue", "green", "red", "purple", "orange", "turquoise", "black", "gray"][grid[r][c]]; 
            ctx.font = "bold 18px Arial"; 
            ctx.fillText(grid[r][c], x + TILE / 2 - 4, y + TILE / 2 + 6); 
        }
        // Draw Mine
        if(grid[r][c] === -1){ 
            ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(x + TILE / 2, y + TILE / 2, 10, 0, 2 * Math.PI); ctx.fill(); 
        }
      } else {
        // Draw covered cell
        ctx.fillStyle = "#aaa"; ctx.fillRect(x, y, TILE, TILE); ctx.strokeRect(x, y, TILE, TILE);
        
        // Draw Flag
        if(flagged[r][c]){ 
            ctx.fillStyle = "red"; ctx.beginPath(); ctx.arc(x + TILE / 2, y + TILE / 2, 8, 0, 2 * Math.PI); ctx.fill(); 
        }
      }
      
      // Draw Red Background for wrong mines on Loss
      if(gameOver && grid[r][c] === -1 && !revealed[r][c]){ 
          ctx.fillStyle = "#f00"; ctx.fillRect(x, y, TILE, TILE); ctx.strokeRect(x, y, TILE, TILE); 
      }
    }
  }
}

// Redraw every 50ms for timer updates
setInterval(() => { updateUI(); draw(); }, 50);

// Initial start
setDifficulty();
</script>
</body>
</html>
