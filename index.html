<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lewis' Minesweeper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="./favicon.ico">
    <link rel="apple-touch-icon" href="./favicon.png">
</head>

<body>
    <h1>Lewis' Minesweeper</h1>

    <div id="difficultySelect">
        <label for="difficulty">Difficulty:</label>
        <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="intermediate">Intermediate</option>
            <option value="hard">Hard</option>
        </select>
        <button id="customDifficultyBtn">⚙️ Custom</button>
    </div>

    <div id="wrapper">
        <div id="topbar">
            <div id="mineCounter" class="digits">010</div>
            
            <button id="smiley" aria-label="Reset Game">😊</button>
            
            <div id="timer" class="digits">000.000</div>
        </div>
        
        <canvas id="board" tabindex="0" aria-label="Minesweeper board game"></canvas>
    </div>

    <div id="controls">
        <button id="hintButton">💡 Hint (<span id="hintCount">3</span>)</button>
        <button id="flagToggle">Flag Mode: OFF</button>
    </div>

    <div id="stats"></div>
    <h2>Leaderboard</h2>
    <div id="leaderboard"></div>

    <div id="settings">
        <h3>Settings</h3>
        <label><input type="checkbox" id="toggleFlag"> Flag Toggle Mode</label><br>
        <label><input type="checkbox" id="showStats" checked> Show Stats</label><br>
        <label><input type="checkbox" id="showDeleteButton" checked> Delete Leaderboard Entry</label><br>
        <label>Theme colour: <input type="color" id="themeColor" value="#c0c0c0"></label><br>
        <label>Long Press Duration (ms): 
            <input type="number" id="longPressDuration" min="100" max="1000" step="50" value="200">
            <span id="longPressDurationValue"></span>
        </label><br>
        <label>Volume: 
            <input type="range" id="volumeSlider" min="0" max="100" value="100">
            <span id="volumeValue">100%</span>
        </label><br>
    </div>

    <!-- Custom Difficulty Modal -->
    <div id="customDifficultyModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Custom Difficulty</h2>
            <div class="custom-difficulty-form">
                <label>
                    Rows:
                    <input type="number" id="customRows" min="2" max="100" value="9">
                </label>
                <label>
                    Columns:
                    <input type="number" id="customCols" min="2" max="100" value="9">
                </label>
                <label>
                    Mines:
                    <input type="number" id="customMines" min="1" max="10000" value="10">
                </label>
                <div id="customDifficultyError" style="color: #cc0000; margin: 10px 0;"></div>
                <div id="customDifficultyInfo" style="color: #0066cc; margin: 10px 0; font-size: 13px;"></div>
                <div class="modal-buttons">
                    <button class="cancel-btn" id="closeDifficultyBtn">Cancel</button>
                    <button class="confirm-btn" id="applyDifficultyBtn">Play</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <footer>
        <div id="reportBugPanel">
            <button onclick="window.location.href='https://github.com/Gzilla999/Minesweeper/issues';">Report a Bug or Suggest a Feature</button>
        </div>
    </footer>
</body>
</html>
