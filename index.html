<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Minesweeper Online - Global Leaderboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
    body { background:#c0c0c0; font-family:Tahoma, sans-serif; text-align:center; }
    #wrapper { display:inline-block; background:#c0c0c0; border:4px solid #808080; padding:6px; }
    #topbar { display:flex; justify-content:space-between; align-items:center; background:#c0c0c0; border:3px solid #808080; margin-bottom:6px; padding:4px; }
    .digits { background:black; color:red; font-family:'Courier New', monospace; font-weight:bold; font-size:22px; width:80px; text-align:right; padding:2px; border:inset 2px #808080; }
    #smiley { width:32px; height:32px; border:2px solid #808080; background:#c0c0c0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:20px; }
    canvas { display:block; background:#c0c0c0; margin:5px 0; border: 3px inset #fff; }
    button { margin:2px; font-family: Tahoma; background: #c0c0c0; border: 2px outset #fff; cursor: pointer; padding: 4px 8px; }
    button:active { border: 2px inset #fff; }
    #settings { margin:10px; border:2px solid #808080; background:#c0c0c0; padding:10px; display:inline-block; text-align:left; vertical-align: top; width: 320px; }
    .leaderboard-entry { cursor:pointer; font-size:12px; text-align:left; padding:4px; border-bottom:1px solid #808080; display: flex; justify-content: space-between; }
    .leaderboard-entry:hover { background: #000080; color: white; }
    .auth-box { border: 2px inset #808080; padding: 8px; margin-bottom: 10px; background: #d0d0d0; }
    input { font-family: Tahoma; font-size: 12px; margin: 2px; border: 2px inset #fff; padding: 4px; width: calc(100% - 15px); }
    h4 { margin: 5px 0; font-size: 14px; text-decoration: underline; }
    #user-status { font-size: 11px; margin-top: 4px; font-weight: bold; }
    #leaderboard { max-height: 200px; overflow-y: auto; background: #fff; border: 2px inset #808080; margin-bottom: 5px; min-height: 50px; }
</style>
</head>
<body>

<h2>Minesweeper Online</h2>

<div style="margin-bottom: 10px;">
  Difficulty: 
  <select id="difficulty" style="font-family: Tahoma;">
    <option value="easy">Easy (9x9)</option>
    <option value="intermediate">Intermediate (16x16)</option>
    <option value="hard">Hard (30x16)</option>
  </select>
</div>

<div id="wrapper">
  <div id="topbar">
    <div id="mineCounter" class="digits">000</div>
    <div id="smiley">😊</div> 
    <div id="timer" class="digits">000.000</div>
  </div>
  <canvas id="board"></canvas> 
</div>

<div id="settings">
  <h4>Player Account</h4>
  <div class="auth-box">
    <input type="email" id="email" placeholder="Email (test@test.com)">
    <input type="password" id="password" placeholder="Password (6+ chars)">
    <div style="margin-top: 5px;">
        <button onclick="handleLogin()">Login</button>
        <button onclick="handleSignUp()">Sign Up</button>
    </div>
    <div id="user-status">Not logged in.</div>
  </div>
  
  <h4>Leaderboard (Top 10)</h4>
  <div id="leaderboard"></div>
  <button id="refreshScores" style="width: 100%;">Refresh</button>
</div>

<script>
/* --- SUPABASE CONFIG --- */
const SUPABASE_URL = 'https://truygcgalekdafoxqoau.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRydXlnY2dhbGVrZGFmb3hxb2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MjM0NjgsImV4cCI6MjA4Mzk5OTQ2OH0.S4_CjhbbDgDGWAGUnUmA1KmPJitI98IWHKMAbuRxq8A';
const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* --- GAME CONFIG --- */
let difficulties = {
  easy: {rows:9, cols:9, mines:10},
  intermediate: {rows:16, cols:16, mines:40},
  hard: {rows:16, cols:30, mines:99}
};

let ROWS, COLS, MINES, TILE = 30;
let grid, revealed, flagged, minesSet;
let firstClick = true, gameOver = false, win = false;
let startTime = null, endTime = null, timerInterval;
let currentDifficulty = "easy";
let moveLog = [];

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const leaderboardDiv = document.getElementById("leaderboard");
const userStatus = document.getElementById("user-status");

/* --- AUTH FUNCTIONS --- */
async function handleSignUp() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) alert("Error: " + error.message);
    else alert("Sign up successful! You can now log in.");
}

async function handleLogin() {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) alert("Login failed: " + error.message);
    else {
        userStatus.textContent = "Logged in as: " + data.user.email.split('@')[0];
        userStatus.style.color = "green";
    }
}

/* --- DATABASE FUNCTIONS --- */
async function fetchScores() {
    const { data, error } = await supabase
        .from('scores')
        .select('*')
        .eq('difficulty', currentDifficulty)
        .order('time', { ascending: true })
        .limit(10);
    
    leaderboardDiv.innerHTML = "";
    if (data) {
        data.forEach((s, i) => {
            const entry = document.createElement('div');
            entry.className = 'leaderboard-entry';
            entry.innerHTML = `<span>#${i+1} ${s.username}</span> <span>${s.time.toFixed(2)}s</span>`;
            entry.onclick = () => replay(s.replay_log);
            leaderboardDiv.appendChild(entry);
        });
    }
}

async function saveScore() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) return;

    const elapsed = (endTime - startTime) / 1000;
    const { error } = await supabase.from('scores').insert([{
        user_id: user.id,
        username: user.email.split('@')[0],
        difficulty: currentDifficulty,
        time: elapsed,
        replay_log: { mines: Array.from(minesSet), log: moveLog, win: true }
    }]);
    if (!error) fetchScores();
}

/* --- GAME LOGIC --- */
function setDifficulty() {
    const d = difficulties[currentDifficulty];
    ROWS = d.rows; COLS = d.cols; MINES = d.mines;
    canvas.width = COLS * TILE; canvas.height = ROWS * TILE;
    init();
}

function init() {
    grid = Array.from({length: ROWS}, () => Array(COLS).fill(0));
    revealed = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    flagged = Array.from({length: ROWS}, () => Array(COLS).fill(false));
    minesSet = new Set();
    firstClick = true; gameOver = false; win = false;
    startTime = null; endTime = null; moveLog = [];
    document.getElementById("smiley").textContent = "😊";
    clearInterval(timerInterval);
    updateUI(); draw();
}

function placeMines(r0, c0) {
    while(minesSet.size < MINES) {
        let r = Math.floor(Math.random() * ROWS), c = Math.floor(Math.random() * COLS);
        if (Math.abs(r-r0) > 1 || Math.abs(c-c0) > 1) minesSet.add(`${r},${c}`);
    }
    minesSet.forEach(m => {
        let [r, c] = m.split(',').map(Number);
        grid[r][c] = -1;
    });
    for(let r=0; r<ROWS; r++) {
        for(let c=0; c<COLS; c++) {
            if (grid[r][c] === -1) continue;
            let count = 0;
            for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) {
                let nr = r+i, nc = c+j;
                if (nr>=0 && nr<ROWS && nc>=0 && nc<COLS && grid[nr][nc]===-1) count++;
            }
            grid[r][c] = count;
        }
    }
}

function reveal(r, c) {
    if (r<0 || r>=ROWS || c<0 || c>=COLS || revealed[r][c] || flagged[r][c]) return;
    revealed[r][c] = true;
    if (grid[r][c] === 0) {
        for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) reveal(r+i, c+j);
    }
}

canvas.onmousedown = (e) => {
    if (gameOver) return;
    const rect = canvas.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / TILE);
    const r = Math.floor((e.clientY - rect.top) / TILE);
    
    if (firstClick) {
        startTime = Date.now();
        placeMines(r, c);
        firstClick = false;
        timerInterval = setInterval(updateUI, 100);
    }

    if (e.button === 2) { // Right Click
        flagged[r][c] = !flagged[r][c];
        moveLog.push({r, c, type:'flag', time: Date.now() - startTime});
    } else { // Left Click
        if (flagged[r][c]) return;
        moveLog.push({r, c, type:'reveal', time: Date.now() - startTime});
        if (grid[r][c] === -1) {
            gameOver = true; endTime = Date.now();
            document.getElementById("smiley").textContent = "😵";
            clearInterval(timerInterval);
        } else {
            reveal(r, c);
            if (revealed.flat().filter(x => !x).length === MINES) {
                gameOver = true; win = true; endTime = Date.now();
                document.getElementById("smiley").textContent = "😎";
                clearInterval(timerInterval);
                saveScore();
            }
        }
    }
    draw(); updateUI();
};

function draw() {
    ctx.clearRect(0,0,canvas.width, canvas.height);
    for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) {
        let x = c*TILE, y = r*TILE;
        ctx.strokeStyle = "#808080";
        if (revealed[r][c]) {
            ctx.fillStyle = "#ddd"; ctx.fillRect(x,y,TILE,TILE);
            if (grid[r][c] > 0) {
                ctx.fillStyle = ["", "blue", "green", "red", "darkblue", "maroon", "cyan", "black", "gray"][grid[r][c]];
                ctx.font = "bold 16px Tahoma"; ctx.fillText(grid[r][c], x+10, y+22);
            } else if (grid[r][c] === -1) {
                ctx.fillStyle = "black"; ctx.beginPath(); ctx.arc(x+15, y+15, 8, 0, Math.PI*2); ctx.fill();
            }
        } else {
            ctx.fillStyle = "#aaa"; ctx.fillRect(x,y,TILE,TILE);
            if (flagged[r][c]) { ctx.fillStyle = "red"; ctx.fillRect(x+8, y+8, 14, 14); }
        }
        ctx.strokeRect(x,y,TILE,TILE);
    }
}

function updateUI() {
    const elapsed = startTime ? (gameOver ? (endTime-startTime) : (Date.now()-startTime)) : 0;
    document.getElementById("timer").textContent = (elapsed/1000).toFixed(3).padStart(7, "0");
    const flags = flagged.flat().filter(x => x).length;
    document.getElementById("mineCounter").textContent = String(MINES - flags).padStart(3, "0");
}

/* --- REPLAY LOGIC --- */
function replay(data) {
    init();
    firstClick = false;
    minesSet = new Set(data.mines);
    // Redraw grid for replay
    minesSet.forEach(m => { let [r, c] = m.split(',').map(Number); grid[r][c] = -1; });
    for(let r=0; r<ROWS; r++) for(let c=0; c<COLS; c++) {
        if (grid[r][c] === -1) continue;
        let count = 0;
        for(let i=-1; i<=1; i++) for(let j=-1; j<=1; j++) {
            let nr = r+i, nc = c+j;
            if (nr>=0 && nr<ROWS && nc>=0 && nc<COLS && grid[nr][nc]===-1) count++;
        }
        grid[r][c] = count;
    }
    data.log.forEach(move => {
        setTimeout(() => {
            if (move.type === 'reveal') reveal(move.r, move.c);
            else flagged[move.r][move.c] = !flagged[move.r][move.c];
            draw();
        }, move.time);
    });
}

document.getElementById("difficulty").onchange = (e) => { currentDifficulty = e.target.value; setDifficulty(); fetchScores(); };
document.getElementById("smiley").onclick = () => init();
document.getElementById("refreshScores").onclick = () => fetchScores();
canvas.oncontextmenu = (e) => e.preventDefault();

setDifficulty();
fetchScores();
</script>
</body>
</html>
